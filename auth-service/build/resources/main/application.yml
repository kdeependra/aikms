spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aikms_auth}
    username: ${DB_USER:aikms}
    password: ${DB_PASSWORD:aikms_dev_password}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

aikms:
  auth:
    token:
      issuer: ${OAUTH2_ISSUER_URI:http://localhost:8082}
      access-ttl-minutes: ${ACCESS_TTL_MINUTES:15}
      refresh-ttl-hours: ${REFRESH_TTL_HOURS:24}
    jwt:
      key-bits: 2048
