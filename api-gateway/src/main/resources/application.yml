spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000}"
            allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
            allowed-headers: "*"
            allow-credentials: true

      routes:
        # ── Auth service ──────────────────────────────────────────────────────────
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: auth-service
                fallbackUri: forward:/fallback

        # ── KMS service ───────────────────────────────────────────────────────────
        - id: kms-service
          uri: ${KMS_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/namespaces/**
          filters:
            - name: CircuitBreaker
              args:
                name: kms-service
                fallbackUri: forward:/fallback

        # ── Audit service ─────────────────────────────────────────────────────────
        - id: audit-service
          uri: ${AUDIT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/audit/**
          filters:
            - name: CircuitBreaker
              args:
                name: audit-service
                fallbackUri: forward:/fallback

        # ── Policy service ────────────────────────────────────────────────────────
        - id: policy-service
          uri: ${POLICY_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/policies/**
          filters:
            - name: CircuitBreaker
              args:
                name: policy-service
                fallbackUri: forward:/fallback

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8082}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway

resilience4j:
  circuitbreaker:
    instances:
      kms-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      auth-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      audit-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      policy-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
