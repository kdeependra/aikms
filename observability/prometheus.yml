global:
  scrape_interval: 15s

scrape_configs:
  - job_name: kms-service
    static_configs:
      - targets: ["kms-service:8081"]
    metrics_path: /actuator/prometheus

  - job_name: auth-service
    static_configs:
      - targets: ["auth-service:8082"]
    metrics_path: /actuator/prometheus

  - job_name: audit-service
    static_configs:
      - targets: ["audit-service:8083"]
    metrics_path: /actuator/prometheus

  - job_name: policy-service
    static_configs:
      - targets: ["policy-service:8084"]
    metrics_path: /actuator/prometheus

  - job_name: notification-service
    static_configs:
      - targets: ["notification-service:8085"]
    metrics_path: /actuator/prometheus

  - job_name: api-gateway
    static_configs:
      - targets: ["api-gateway:8080"]
    metrics_path: /actuator/prometheus

  - job_name: hsm-simulator
    static_configs:
      - targets: ["hsm-simulator:8090"]
    metrics_path: /actuator/prometheus
