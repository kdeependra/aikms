spring:
  application:
    name: policy-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aikms_policy}
    username: ${DB_USER:aikms}
    password: ${DB_PASSWORD:aikms_dev_password}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8082}

server:
  port: ${SERVER_PORT:8084}

aikms:
  opa:
    url: ${OPA_URL:http://localhost:8181}
